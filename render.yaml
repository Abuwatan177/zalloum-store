services:
  - type: web
    name: zalloum-store
    runtime: node
    rootDir: backend
    buildCommand: npm install
   startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: zalloum-store-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /var/data